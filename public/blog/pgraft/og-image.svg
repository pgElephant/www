<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Website theme gradient - matches pgElephant theme -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070d1a;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:1" />
    </linearGradient>
    <!-- Overlay gradient - matches hero section -->
    <linearGradient id="overlayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.15" />
    </linearGradient>
    <!-- Text gradient - matches website theme -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <!-- Node gradients -->
    <linearGradient id="node1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="node2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="node3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Background - matches website theme -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#overlayGradient)"/>
  
  <!-- Subtle pattern overlay - matches hero -->
  <g opacity="0.1">
    <circle cx="100" cy="100" r="4" fill="#fff"/>
    <circle cx="150" cy="180" r="3" fill="#fff"/>
    <circle cx="200" cy="120" r="3.5" fill="#fff"/>
    <circle cx="1000" cy="450" r="4" fill="#fff"/>
    <circle cx="1100" cy="300" r="3" fill="#fff"/>
    <circle cx="900" cy="380" r="3.5" fill="#fff"/>
  </g>
  
  <!-- Raft nodes illustration -->
  <g transform="translate(120, 200)">
    <!-- Node 1 - Follower -->
    <rect x="0" y="0" width="100" height="100" rx="16" fill="url(#node1)" opacity="0.9"/>
    <circle cx="50" cy="50" r="18" fill="#fff" opacity="0.9"/>
    <text x="50" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#06b6d4" text-anchor="middle">Follower</text>
    
    <!-- Node 2 - Leader -->
    <rect x="0" y="180" width="100" height="100" rx="16" fill="url(#node2)" opacity="0.9"/>
    <circle cx="50" cy="230" r="18" fill="#fff" opacity="0.9"/>
    <text x="50" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle">LEADER</text>
    
    <!-- Node 3 - Follower -->
    <rect x="160" y="90" width="100" height="100" rx="16" fill="url(#node3)" opacity="0.9"/>
    <circle cx="210" cy="140" r="18" fill="#fff" opacity="0.9"/>
    <text x="210" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#10b981" text-anchor="middle">Follower</text>
    
    <!-- Connections -->
    <line x1="100" y1="50" x2="160" y2="140" stroke="#06b6d4" stroke-width="4" opacity="0.5"/>
    <line x1="50" y1="100" x2="50" y2="180" stroke="#fbbf24" stroke-width="4" opacity="0.6"/>
    <line x1="100" y1="230" x2="160" y2="140" stroke="#10b981" stroke-width="4" opacity="0.5"/>
  </g>
  
  <!-- Title -->
  <text x="450" y="230" font-family="Arial, sans-serif" font-size="96" font-weight="bold" 
        fill="url(#textGradient)">
    pgraft
  </text>
  
  <!-- Subtitle -->
  <text x="450" y="300" font-family="Arial, sans-serif" font-size="36" 
        fill="#e0e7ff" opacity="0.9">
    Raft Consensus for PostgreSQL
  </text>
  
  <!-- Feature badges - matching theme colors -->
  <g transform="translate(450, 340)">
    <rect x="0" y="0" width="280" height="48" rx="24" fill="#4f46e5" opacity="0.2"/>
    <rect x="0" y="0" width="280" height="48" rx="24" fill="none" stroke="#4f46e5" stroke-width="2"/>
    <text x="140" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="600" 
          fill="#fff" text-anchor="middle">✓ Auto Leader Election</text>
  </g>
  
  <g transform="translate(750, 340)">
    <rect x="0" y="0" width="240" height="48" rx="24" fill="#06b6d4" opacity="0.2"/>
    <rect x="0" y="0" width="240" height="48" rx="24" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="120" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="600" 
          fill="#fff" text-anchor="middle">✓ Zero Split-Brain</text>
  </g>
  
  <g transform="translate(450, 410)">
    <rect x="0" y="0" width="280" height="48" rx="24" fill="#10b981" opacity="0.2"/>
    <rect x="0" y="0" width="280" height="48" rx="24" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="600" 
          fill="#fff" text-anchor="middle">✓ Crash-Safe Replication</text>
  </g>
  
  <g transform="translate(750, 410)">
    <rect x="0" y="0" width="240" height="48" rx="24" fill="#fbbf24" opacity="0.2"/>
    <rect x="0" y="0" width="240" height="48" rx="24" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="120" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="600" 
          fill="#fff" text-anchor="middle">✓ Production Ready</text>
  </g>
  
  <!-- pgElephant branding -->
  <text x="600" y="570" font-family="Arial, sans-serif" font-size="24" font-weight="600" 
        fill="#fff" text-anchor="middle" opacity="0.6">
    pgElephant
  </text>
  
  <!-- Decorative elements - matching theme -->
  <circle cx="1000" cy="200" r="60" fill="#4f46e5" opacity="0.15"/>
  <circle cx="1100" cy="320" r="45" fill="#06b6d4" opacity="0.15"/>
  <circle cx="1020" cy="420" r="35" fill="#10b981" opacity="0.15"/>
  <circle cx="1120" cy="220" r="28" fill="#fbbf24" opacity="0.15"/>
</svg>
