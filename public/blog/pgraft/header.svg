<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1f3a"/>
      <stop offset="0.5" stop-color="#0a0e27"/>
      <stop offset="1" stop-color="#2d1b3d"/>
    </linearGradient>
    <linearGradient id="elephantBody" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#336791"/>
      <stop offset="1" stop-color="#4a9eff"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#336791"/>
      <stop offset="1" stop-color="#4a9eff"/>
    </linearGradient>
    <linearGradient id="node1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#6b5ce7"/>
    </linearGradient>
    <linearGradient id="node2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd700"/>
      <stop offset="1" stop-color="#ffaa00"/>
    </linearGradient>
    <linearGradient id="node3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#6b5ce7"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4a9eff"/>
      <stop offset="0.5" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#6b5ce7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="12" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.15">
    <rect x="0" y="126" width="1200" height="2" fill="#4a9eff"/>
    <rect x="0" y="252" width="1200" height="2" fill="#4a9eff"/>
    <rect x="0" y="378" width="1200" height="2" fill="#4a9eff"/>
    <rect x="0" y="504" width="1200" height="2" fill="#4a9eff"/>
    <rect x="240" y="0" width="2" height="630" fill="#4a9eff"/>
    <rect x="480" y="0" width="2" height="630" fill="#4a9eff"/>
    <rect x="720" y="0" width="2" height="630" fill="#4a9eff"/>
    <rect x="960" y="0" width="2" height="630" fill="#4a9eff"/>
  </g>
  <!-- Elephant -->
  <g opacity="0.25">
    <ellipse cx="990" cy="315" rx="90" ry="100" fill="url(#elephantBody)"/>
    <rect x="930" y="340" width="40" height="120" rx="20" fill="url(#trunk)" transform="rotate(-20 930 340)"/>
  </g>
  <!-- Raft nodes -->
  <g>
    <rect x="200" y="195" width="80" height="80" rx="16" fill="url(#node1)"/>
    <rect x="200" y="275" width="80" height="80" rx="16" fill="url(#node2)"/>
    <rect x="200" y="355" width="80" height="80" rx="16" fill="url(#node3)"/>
    <circle cx="240" cy="235" r="15" fill="#fff" opacity="0.9"/>
    <circle cx="240" cy="315" r="15" fill="#fff" opacity="0.9"/>
    <circle cx="240" cy="395" r="15" fill="#fff" opacity="0.9"/>
    <!-- Leader label -->
    <text x="240" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffd700">LEADER</text>
    <!-- Connections -->
    <rect x="280" y="235" width="120" height="3" fill="#4a9eff" opacity="0.6"/>
    <rect x="280" y="395" width="120" height="3" fill="#4a9eff" opacity="0.6"/>
  </g>
  <!-- Title and tagline -->
  <g>
    <text x="400" y="200" font-size="72" font-weight="900" fill="url(#text)" letter-spacing="-2">pgraft</text>
    <text x="400" y="260" font-size="32" fill="#a0b4d4">Raft Consensus Protocol</text>
    <text x="400" y="300" font-size="32" fill="#a0b4d4">Embedded in PostgreSQL</text>
    <!-- Feature badges -->
    <rect x="400" y="340" width="260" height="38" rx="19" fill="#4a9eff" opacity="0.15"/>
    <text x="430" y="366" font-size="18" fill="#4a9eff" font-weight="600">✓ Auto Leader Election</text>
    <rect x="670" y="340" width="210" height="38" rx="19" fill="#4a9eff" opacity="0.15"/>
    <text x="690" y="366" font-size="18" fill="#4a9eff" font-weight="600">✓ Zero Split-Brain</text>
    <rect x="400" y="390" width="260" height="38" rx="19" fill="#4a9eff" opacity="0.15"/>
    <text x="430" y="416" font-size="18" fill="#4a9eff" font-weight="600">✓ Crash-Safe Replication</text>
    <rect x="670" y="390" width="210" height="38" rx="19" fill="#4a9eff" opacity="0.15"/>
    <text x="690" y="416" font-size="18" fill="#4a9eff" font-weight="600">✓ Production Ready</text>
    <!-- Version -->
    <text x="420" y="590" font-size="18" fill="#fff" opacity="0.4">PostgreSQL 16+ | v1.0.0</text>
  </g>
</svg>
