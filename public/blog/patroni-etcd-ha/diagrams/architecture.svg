<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="appGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="etcdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="patroniGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="standbyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.8" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" opacity="0.8"/>
    </marker>
    <marker id="arrowheadBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3b82f6" opacity="0.8"/>
    </marker>
    <marker id="arrowheadPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8b5cf6" opacity="0.8"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#0f172a" rx="8"/>
  
  <!-- Application Layer -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="900" height="80" rx="8" fill="url(#appGradient)" opacity="0.9"/>
    <rect x="0" y="0" width="900" height="80" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="450" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Application Layer</text>
    <text x="450" y="60" font-family="Arial, sans-serif" font-size="14" fill="#e0e7ff" text-anchor="middle">Connects directly to PostgreSQL nodes (port 5432)</text>
  </g>
  
  <!-- Connection from App to PostgreSQL Nodes -->
  <line x1="250" y1="110" x2="250" y2="200" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrowheadBlue)"/>
  <line x1="500" y1="110" x2="500" y2="200" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrowheadBlue)"/>
  <line x1="750" y1="110" x2="750" y2="200" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrowheadBlue)"/>
  <text x="250" y="160" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">Writes</text>
  <text x="500" y="160" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">Reads</text>
  <text x="750" y="160" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">Reads</text>
  
  <!-- etcd Cluster Layer -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="900" height="100" rx="8" fill="url(#etcdGradient)" opacity="0.95" filter="url(#glow)"/>
    <rect x="0" y="0" width="900" height="100" rx="8" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <text x="450" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">etcd Cluster (Consensus & Leader Election)</text>
    <line x1="50" y1="45" x2="850" y2="45" stroke="#fff" stroke-width="1" opacity="0.3"/>
    
    <!-- etcd Node 1 -->
    <g transform="translate(200, 60)">
      <circle cx="0" cy="0" r="15" fill="#fff" opacity="0.9"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6" text-anchor="middle">e1</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">10.0.1.20</text>
    </g>
    
    <!-- etcd Node 2 -->
    <g transform="translate(450, 60)">
      <circle cx="0" cy="0" r="15" fill="#fff" opacity="0.9"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6" text-anchor="middle">e2</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">10.0.1.21</text>
    </g>
    
    <!-- etcd Node 3 -->
    <g transform="translate(700, 60)">
      <circle cx="0" cy="0" r="15" fill="#fff" opacity="0.9"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6" text-anchor="middle">e3</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">10.0.1.22</text>
    </g>
    
    <!-- Connection lines between etcd nodes -->
    <line x1="215" y1="60" x2="435" y2="60" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <line x1="465" y1="60" x2="685" y2="60" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <line x1="215" y1="60" x2="685" y2="60" stroke="#fff" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Connections from etcd to Patroni -->
  <line x1="250" y1="300" x2="200" y2="350" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowheadPurple)" opacity="0.6"/>
  <line x1="500" y1="300" x2="500" y2="350" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowheadPurple)" opacity="0.6"/>
  <line x1="750" y1="300" x2="800" y2="350" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowheadPurple)" opacity="0.6"/>
  <text x="200" y="325" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6" text-anchor="middle">Consensus</text>
  <text x="500" y="325" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6" text-anchor="middle">Leader Election</text>
  <text x="800" y="325" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6" text-anchor="middle">State</text>
  
  <!-- Patroni Agents on PostgreSQL Nodes -->
  <!-- Node 1 with Patroni -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="200" height="200" rx="8" fill="url(#primaryGradient)" opacity="0.95" filter="url(#glow)"/>
    <rect x="0" y="0" width="200" height="200" rx="8" fill="none" stroke="#fbbf24" stroke-width="3"/>
    
    <!-- Patroni Agent -->
    <rect x="10" y="10" width="180" height="50" rx="4" fill="url(#patroniGradient)" opacity="0.9"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Patroni Agent</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" fill="#cffafe" text-anchor="middle">10.0.1.10:8008</text>
    <text x="100" y="58" font-family="Arial, sans-serif" font-size="9" fill="#cffafe" text-anchor="middle">Leader Election</text>
    
    <text x="100" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">PostgreSQL Node 1</text>
    <text x="100" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fef3c7" text-anchor="middle">PRIMARY</text>
    <line x1="20" y1="115" x2="180" y2="115" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <text x="100" y="135" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">10.0.1.10:5432</text>
    <text x="20" y="155" font-family="Arial, sans-serif" font-size="10" fill="#fff">✓ Accepts Writes</text>
    <text x="20" y="170" font-family="Arial, sans-serif" font-size="10" fill="#fff">✓ Serves Reads</text>
    <text x="20" y="185" font-family="Arial, sans-serif" font-size="10" fill="#fff">✓ Streams WAL</text>
  </g>
  
  <!-- Node 2 with Patroni -->
  <g transform="translate(400, 350)">
    <rect x="0" y="0" width="200" height="200" rx="8" fill="url(#standbyGradient)" opacity="0.9" filter="url(#glow)"/>
    <rect x="0" y="0" width="200" height="200" rx="8" fill="none" stroke="#06b6d4" stroke-width="3"/>
    
    <!-- Patroni Agent -->
    <rect x="10" y="10" width="180" height="50" rx="4" fill="url(#patroniGradient)" opacity="0.9"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Patroni Agent</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" fill="#cffafe" text-anchor="middle">10.0.1.11:8008</text>
    <text x="100" y="58" font-family="Arial, sans-serif" font-size="9" fill="#cffafe" text-anchor="middle">Standby Ready</text>
    
    <text x="100" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">PostgreSQL Node 2</text>
    <text x="100" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#cffafe" text-anchor="middle">STANDBY</text>
    <line x1="20" y1="115" x2="180" y2="115" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <text x="100" y="135" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">10.0.1.11:5432</text>
    <text x="20" y="155" font-family="Arial, sans-serif" font-size="10" fill="#fff">✓ Receives WAL</text>
    <text x="20" y="170" font-family="Arial, sans-serif" font-size="10" fill="#fff">✓ Serves Reads</text>
    <text x="20" y="185" font-family="Arial, sans-serif" font-size="10" fill="#fff">✓ Auto-Promote Ready</text>
  </g>
  
  <!-- Node 3 with Patroni -->
  <g transform="translate(700, 350)">
    <rect x="0" y="0" width="200" height="200" rx="8" fill="url(#standbyGradient)" opacity="0.9" filter="url(#glow)"/>
    <rect x="0" y="0" width="200" height="200" rx="8" fill="none" stroke="#06b6d4" stroke-width="3"/>
    
    <!-- Patroni Agent -->
    <rect x="10" y="10" width="180" height="50" rx="4" fill="url(#patroniGradient)" opacity="0.9"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Patroni Agent</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" fill="#cffafe" text-anchor="middle">10.0.1.12:8008</text>
    <text x="100" y="58" font-family="Arial, sans-serif" font-size="9" fill="#cffafe" text-anchor="middle">Standby Ready</text>
    
    <text x="100" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">PostgreSQL Node 3</text>
    <text x="100" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#cffafe" text-anchor="middle">STANDBY</text>
    <line x1="20" y1="115" x2="180" y2="115" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <text x="100" y="135" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">10.0.1.12:5432</text>
    <text x="20" y="155" font-family="Arial, sans-serif" font-size="10" fill="#fff">✓ Receives WAL</text>
    <text x="20" y="170" font-family="Arial, sans-serif" font-size="10" fill="#fff">✓ Serves Reads</text>
    <text x="20" y="185" font-family="Arial, sans-serif" font-size="10" fill="#fff">✓ Auto-Promote Ready</text>
  </g>
  
  <!-- Replication Lines -->
  <line x1="200" y1="450" x2="500" y2="450" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="470" x2="800" y2="470" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="350" y="445" font-family="Arial, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">WAL Streaming</text>
  <text x="500" y="495" font-family="Arial, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">WAL Streaming</text>
  
  <!-- Legend -->
  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="900" height="80" rx="4" fill="#1e293b" opacity="0.8"/>
    <circle cx="20" cy="20" r="6" fill="#3b82f6"/>
    <text x="35" y="25" font-family="Arial, sans-serif" font-size="11" fill="#fff">Client Connection</text>
    <circle cx="180" cy="20" r="6" fill="#8b5cf6"/>
    <text x="195" y="25" font-family="Arial, sans-serif" font-size="11" fill="#fff">etcd Consensus</text>
    <circle cx="320" cy="20" r="6" fill="#06b6d4"/>
    <text x="335" y="25" font-family="Arial, sans-serif" font-size="11" fill="#fff">Patroni Agent</text>
    <line x1="470" y1="20" x2="490" y2="20" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="500" y="25" font-family="Arial, sans-serif" font-size="11" fill="#fff">WAL Replication</text>
    <rect x="650" y="14" width="20" height="12" rx="2" fill="#fbbf24"/>
    <text x="680" y="25" font-family="Arial, sans-serif" font-size="11" fill="#fff">Primary Node</text>
    <rect x="770" y="14" width="20" height="12" rx="2" fill="#06b6d4"/>
    <text x="800" y="25" font-family="Arial, sans-serif" font-size="11" fill="#fff">Standby Node</text>
    
    <text x="50" y="55" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Architecture: etcd provides distributed consensus, Patroni manages PostgreSQL lifecycle, PostgreSQL nodes handle data</text>
  </g>
</svg>


