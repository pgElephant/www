<svg width="1400" height="950" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#44ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc55;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4488ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaa44;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8844ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5500cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff4444" />
    </marker>
    <marker id="arrowheadGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#44ff88" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="700" y="50" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    Split-Brain Scenario: The Problem
  </text>
  <text x="700" y="80" font-family="Arial, sans-serif" font-size="18" fill="#aaaaaa" text-anchor="middle">
    Multiple primaries cause data corruption and inconsistency
  </text>
  
  <!-- Left Side: Split-Brain Problem -->
  <g transform="translate(350, 250)">
    <rect x="-300" y="-150" width="600" height="500" rx="15" fill="#1a1f2e" stroke="#ff4444" stroke-width="3" opacity="0.3"/>
    <text x="0" y="-120" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ff4444" text-anchor="middle">Without Quorum Protection</text>
    
    <!-- Network Partition Line -->
    <line x1="0" y1="0" x2="0" y2="300" stroke="#ff4444" stroke-width="4" stroke-dasharray="10,5" opacity="0.6"/>
    <text x="10" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff4444" transform="rotate(90 10 150)">Network Partition</text>
    
    <!-- Left Partition: Primary 1 -->
    <g transform="translate(-150, 50)">
      <circle cx="0" cy="0" r="50" fill="url(#redGradient)" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="40" fill="url(#redGradient)"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">P1</text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff4444" text-anchor="middle">Primary</text>
      <text x="0" y="100" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Node 1</text>
      
      <!-- Write operations -->
      <rect x="-60" y="120" width="120" height="60" rx="5" fill="#1a1f2e" stroke="#ff4444" stroke-width="2"/>
      <text x="0" y="140" font-family="Arial, sans-serif" font-size="11" fill="#ff4444" text-anchor="middle">Write: User A</text>
      <text x="0" y="155" font-family="Arial, sans-serif" font-size="11" fill="#ff4444" text-anchor="middle">Balance = $100</text>
      <text x="0" y="170" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Accepted</text>
    </g>
    
    <!-- Right Partition: Primary 2 -->
    <g transform="translate(150, 50)">
      <circle cx="0" cy="0" r="50" fill="url(#redGradient)" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="40" fill="url(#redGradient)"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">P2</text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff4444" text-anchor="middle">Primary</text>
      <text x="0" y="100" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Node 2</text>
      
      <!-- Write operations -->
      <rect x="-60" y="120" width="120" height="60" rx="5" fill="#1a1f2e" stroke="#ff4444" stroke-width="2"/>
      <text x="0" y="140" font-family="Arial, sans-serif" font-size="11" fill="#ff4444" text-anchor="middle">Write: User A</text>
      <text x="0" y="155" font-family="Arial, sans-serif" font-size="11" fill="#ff4444" text-anchor="middle">Balance = $200</text>
      <text x="0" y="170" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Accepted</text>
    </g>
    
    <!-- Conflict Warning -->
    <rect x="-200" y="220" width="400" height="80" rx="10" fill="#1a1f2e" stroke="#ff4444" stroke-width="3"/>
    <text x="0" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff4444" text-anchor="middle">Data Conflict</text>
    <text x="0" y="265" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Same user, different values</text>
    <text x="0" y="285" font-family="Arial, sans-serif" font-size="12" fill="#ffaa44" text-anchor="middle">Data corruption when partitions merge</text>
  </g>
  
  <!-- Right Side: Quorum Solution -->
  <g transform="translate(1050, 250)">
    <rect x="-300" y="-150" width="600" height="500" rx="15" fill="#1a1f2e" stroke="#44ff88" stroke-width="3" opacity="0.3"/>
    <text x="0" y="-120" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#44ff88" text-anchor="middle">With Quorum Protection</text>
    
    <!-- Three Nodes -->
    <g transform="translate(-120, 50)">
      <circle cx="0" cy="0" r="40" fill="url(#greenGradient)"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">P</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#44ff88" text-anchor="middle">Node 1</text>
    </g>
    
    <g transform="translate(0, 50)">
      <circle cx="0" cy="0" r="40" fill="url(#blueGradient)"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#4488ff" text-anchor="middle">Node 2</text>
    </g>
    
    <g transform="translate(120, 50)">
      <circle cx="0" cy="0" r="40" fill="url(#blueGradient)"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#4488ff" text-anchor="middle">Node 3</text>
    </g>
    
    <!-- Connection lines showing quorum -->
    <line x1="-80" y1="50" x2="-40" y2="50" stroke="#44ff88" stroke-width="2"/>
    <line x1="40" y1="50" x2="80" y2="50" stroke="#44ff88" stroke-width="2"/>
    <line x1="-40" y1="50" x2="40" y2="50" stroke="#44ff88" stroke-width="2"/>
    
    <!-- Quorum indicator -->
    <rect x="-100" y="100" width="200" height="50" rx="5" fill="#1a1f2e" stroke="#44ff88" stroke-width="2"/>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#44ff88" text-anchor="middle">Quorum: 2 of 3</text>
    <text x="0" y="140" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Majority required</text>
    
    <!-- Network Partition Scenario -->
    <line x1="-150" y1="200" x2="150" y2="200" stroke="#ffaa44" stroke-width="3" stroke-dasharray="8,4" opacity="0.6"/>
    <text x="0" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffaa44" text-anchor="middle">Network Partition</text>
    
    <!-- Left partition after split -->
    <g transform="translate(-120, 250)">
      <circle cx="0" cy="0" r="35" fill="url(#greenGradient)" opacity="0.7"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">P</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="11" fill="#ffaa44" text-anchor="middle">1 node</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="11" fill="#ff4444" text-anchor="middle">No quorum</text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="11" fill="#ff4444" text-anchor="middle">Read-only</text>
    </g>
    
    <!-- Right partition after split -->
    <g transform="translate(120, 250)">
      <circle cx="0" cy="0" r="35" fill="url(#greenGradient)"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">P</text>
      <circle cx="-30" cy="0" r="30" fill="url(#blueGradient)"/>
      <text x="-30" y="8" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#44ff88" stroke-width="2"/>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="11" fill="#44ff88" text-anchor="middle">2 nodes</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="11" fill="#44ff88" text-anchor="middle">Has quorum</text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="11" fill="#44ff88" text-anchor="middle">Accepts writes</text>
    </g>
    
    <!-- Solution explanation -->
    <rect x="-200" y="350" width="400" height="80" rx="10" fill="#1a1f2e" stroke="#44ff88" stroke-width="3"/>
    <text x="0" y="375" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#44ff88" text-anchor="middle">Prevented Split-Brain</text>
    <text x="0" y="395" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Only majority partition accepts writes</text>
    <text x="0" y="415" font-family="Arial, sans-serif" font-size="12" fill="#44ff88" text-anchor="middle">Data consistency maintained</text>
  </g>
  
  <!-- Bottom Explanation -->
  <rect x="200" y="800" width="1000" height="80" rx="15" fill="#1a1f2e" stroke="#4488ff" stroke-width="2"/>
  <text x="700" y="830" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4488ff" text-anchor="middle">How Quorum Prevents Split-Brain</text>
  <text x="700" y="855" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">
    With 3 nodes, a quorum requires 2 nodes. During network partition, only the partition with 2+ nodes can accept writes. The isolated node becomes read-only, preventing conflicting writes and data corruption.
  </text>
  <text x="700" y="875" font-family="Arial, sans-serif" font-size="14" fill="#ffaa44" text-anchor="middle">
    When network heals, the isolated node syncs with the majority partition automatically.
  </text>
</svg>
