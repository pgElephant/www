<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pgbalancerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="standbyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.9" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" opacity="0.8"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#0f172a" rx="8"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">Component Roles and Responsibilities</text>
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">3-Node PostgreSQL HA Cluster with pgBalancer</text>
  
  <!-- pgBalancer Component -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="1100" height="140" rx="12" fill="url(#pgbalancerGradient)" opacity="0.95" filter="url(#glow)"/>
    <rect x="0" y="0" width="1100" height="140" rx="12" fill="none" stroke="#4f46e5" stroke-width="3"/>
    
    <!-- Icon/Logo Area -->
    <g transform="translate(30, 20)">
      <circle cx="50" cy="50" r="40" fill="#fff" opacity="0.2"/>
      <circle cx="50" cy="50" r="30" fill="none" stroke="#fff" stroke-width="3"/>
      <line x1="20" y1="50" x2="80" y2="50" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="35" cy="50" r="5" fill="#06b6d4"/>
      <circle cx="50" cy="50" r="5" fill="#10b981"/>
      <circle cx="65" cy="50" r="5" fill="#fbbf24"/>
    </g>
    
    <!-- Title and Address -->
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff">pgBalancer</text>
    <text x="150" y="70" font-family="Arial, sans-serif" font-size="16" fill="#c7d2fe">10.0.1.5:9999</text>
    <line x1="150" y1="85" x2="1080" y2="85" stroke="#fff" stroke-width="1" opacity="0.3"/>
    
    <!-- Features List -->
    <g transform="translate(150, 100)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#fff">
        <tspan x="0" dy="0">✓ Accepts client connections</tspan>
        <tspan x="0" dy="18">✓ Manages connection pools</tspan>
        <tspan x="0" dy="18">✓ Routes queries using AI-powered load balancing</tspan>
      </text>
      <text x="400" y="0" font-family="Arial, sans-serif" font-size="13" fill="#fff">
        <tspan x="400" dy="0">✓ Monitors backend health</tspan>
        <tspan x="400" dy="18">✓ Detects failures and triggers failover</tspan>
        <tspan x="400" dy="18">✓ Provides REST API for management</tspan>
      </text>
    </g>
  </g>
  
  <!-- PostgreSQL Node 1 (Primary) -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="340" height="200" rx="12" fill="url(#primaryGradient)" opacity="0.95" filter="url(#glow)"/>
    <rect x="0" y="0" width="340" height="200" rx="12" fill="none" stroke="#fbbf24" stroke-width="3"/>
    
    <!-- Database Icon -->
    <g transform="translate(20, 20)">
      <ellipse cx="30" cy="20" rx="25" ry="6" fill="#fff" opacity="0.3"/>
      <rect x="5" y="20" width="50" height="40" rx="3" fill="#fff" opacity="0.2"/>
      <ellipse cx="30" cy="60" rx="25" ry="6" fill="#fff" opacity="0.3"/>
      <line x1="30" y1="20" x2="30" y2="60" stroke="#fff" stroke-width="2" opacity="0.4"/>
      <!-- Primary Badge -->
      <circle cx="50" cy="10" r="12" fill="#fbbf24"/>
      <text x="50" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">P</text>
    </g>
    
    <!-- Title -->
    <text x="100" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">PostgreSQL Node 1</text>
    <text x="100" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fef3c7">PRIMARY</text>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="14" fill="#fff">10.0.1.10:5432</text>
    <line x1="20" y1="90" x2="320" y2="90" stroke="#fff" stroke-width="1" opacity="0.3"/>
    
    <!-- Responsibilities -->
    <g transform="translate(20, 110)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#fff">
        <tspan x="0" dy="0">✓ Accepts write transactions</tspan>
        <tspan x="0" dy="18">✓ Streams WAL to standby nodes</tspan>
        <tspan x="0" dy="18">✓ Serves read queries</tspan>
        <tspan x="0" dy="18">✓ Can be promoted if primary fails</tspan>
      </text>
    </g>
  </g>
  
  <!-- PostgreSQL Node 2 (Standby) -->
  <g transform="translate(430, 300)">
    <rect x="0" y="0" width="340" height="200" rx="12" fill="url(#standbyGradient)" opacity="0.9" filter="url(#glow)"/>
    <rect x="0" y="0" width="340" height="200" rx="12" fill="none" stroke="#06b6d4" stroke-width="3"/>
    
    <!-- Database Icon -->
    <g transform="translate(20, 20)">
      <ellipse cx="30" cy="20" rx="25" ry="6" fill="#fff" opacity="0.3"/>
      <rect x="5" y="20" width="50" height="40" rx="3" fill="#fff" opacity="0.2"/>
      <ellipse cx="30" cy="60" rx="25" ry="6" fill="#fff" opacity="0.3"/>
      <line x1="30" y1="20" x2="30" y2="60" stroke="#fff" stroke-width="2" opacity="0.4"/>
      <!-- Standby Badge -->
      <circle cx="50" cy="10" r="12" fill="#06b6d4"/>
      <text x="50" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">S</text>
    </g>
    
    <!-- Title -->
    <text x="100" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">PostgreSQL Node 2</text>
    <text x="100" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#cffafe">STANDBY</text>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="14" fill="#fff">10.0.1.11:5432</text>
    <line x1="20" y1="90" x2="320" y2="90" stroke="#fff" stroke-width="1" opacity="0.3"/>
    
    <!-- Responsibilities -->
    <g transform="translate(20, 110)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#fff">
        <tspan x="0" dy="0">✓ Receives WAL stream from primary</tspan>
        <tspan x="0" dy="18">✓ Serves read-only queries (hot standby)</tspan>
        <tspan x="0" dy="18">✓ Can be promoted to primary if needed</tspan>
        <tspan x="0" dy="18">✓ Auto-syncs with primary node</tspan>
      </text>
    </g>
  </g>
  
  <!-- PostgreSQL Node 3 (Standby) -->
  <g transform="translate(810, 300)">
    <rect x="0" y="0" width="340" height="200" rx="12" fill="url(#standbyGradient)" opacity="0.9" filter="url(#glow)"/>
    <rect x="0" y="0" width="340" height="200" rx="12" fill="none" stroke="#06b6d4" stroke-width="3"/>
    
    <!-- Database Icon -->
    <g transform="translate(20, 20)">
      <ellipse cx="30" cy="20" rx="25" ry="6" fill="#fff" opacity="0.3"/>
      <rect x="5" y="20" width="50" height="40" rx="3" fill="#fff" opacity="0.2"/>
      <ellipse cx="30" cy="60" rx="25" ry="6" fill="#fff" opacity="0.3"/>
      <line x1="30" y1="20" x2="30" y2="60" stroke="#fff" stroke-width="2" opacity="0.4"/>
      <!-- Standby Badge -->
      <circle cx="50" cy="10" r="12" fill="#06b6d4"/>
      <text x="50" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">S</text>
    </g>
    
    <!-- Title -->
    <text x="100" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff">PostgreSQL Node 3</text>
    <text x="100" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#cffafe">STANDBY</text>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="14" fill="#fff">10.0.1.12:5432</text>
    <line x1="20" y1="90" x2="320" y2="90" stroke="#fff" stroke-width="1" opacity="0.3"/>
    
    <!-- Responsibilities -->
    <g transform="translate(20, 110)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#fff">
        <tspan x="0" dy="0">✓ Receives WAL stream from primary</tspan>
        <tspan x="0" dy="18">✓ Serves read-only queries (hot standby)</tspan>
        <tspan x="0" dy="18">✓ Can be promoted to primary if needed</tspan>
        <tspan x="0" dy="18">✓ Auto-syncs with primary node</tspan>
      </text>
    </g>
  </g>
  
  <!-- Connection Flow Arrows -->
  <!-- From pgBalancer to Nodes -->
  <line x1="600" y1="260" x2="220" y2="300" stroke="#4f46e5" stroke-width="3" opacity="0.6" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="260" x2="600" y2="300" stroke="#4f46e5" stroke-width="3" opacity="0.6" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="260" x2="980" y2="300" stroke="#4f46e5" stroke-width="3" opacity="0.6" marker-end="url(#arrowhead)"/>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">Query Routing</text>
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">Load Balancing</text>
  <text x="800" y="280" font-family="Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">Health Checks</text>
  
  <!-- Replication from Primary to Standbys -->
  <line x1="220" y1="400" x2="600" y2="400" stroke="#10b981" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="220" y1="450" x2="980" y2="450" stroke="#10b981" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="410" y="395" font-family="Arial, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">WAL Streaming</text>
  <text x="600" y="445" font-family="Arial, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">WAL Streaming</text>
  
  <!-- Network Topology Section -->
  <g transform="translate(50, 550)">
    <rect x="0" y="0" width="1100" height="220" rx="12" fill="#1e293b" opacity="0.8"/>
    <rect x="0" y="0" width="1100" height="220" rx="12" fill="none" stroke="#475569" stroke-width="2"/>
    
    <text x="550" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Network Topology Requirements</text>
    <line x1="50" y1="50" x2="1050" y2="50" stroke="#475569" stroke-width="1" opacity="0.5"/>
    
    <g transform="translate(50, 70)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4f46e5">Network Configuration:</text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="12" fill="#fff">
        <tspan x="0" dy="0">• Private Network: For replication traffic (low latency, high bandwidth)</tspan>
        <tspan x="0" dy="20">• Public Network: For client connections (optional, can use private)</tspan>
        <tspan x="0" dy="20">• Firewall Rules: Allow PostgreSQL (5432) and pgBalancer (9999) ports</tspan>
        <tspan x="0" dy="20">• DNS/Service Discovery: Optional but recommended for production</tspan>
      </text>
    </g>
    
    <g transform="translate(600, 70)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10b981">Communication Matrix:</text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="12" fill="#fff">
        <tspan x="0" dy="0">• All nodes → pgBalancer: Health checks, query routing</tspan>
        <tspan x="0" dy="20">• Primary → Standbys: WAL streaming (port 5432)</tspan>
        <tspan x="0" dy="20">• pgBalancer → All nodes: Query distribution</tspan>
        <tspan x="0" dy="20">• Applications → pgBalancer: All database connections (port 9999)</tspan>
      </text>
    </g>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 750)">
    <rect x="0" y="0" width="1100" height="40" rx="8" fill="#1e293b" opacity="0.6"/>
    <rect x="20" y="10" width="20" height="20" rx="4" fill="#4f46e5"/>
    <text x="50" y="25" font-family="Arial, sans-serif" font-size="12" fill="#fff">pgBalancer</text>
    <rect x="200" y="10" width="20" height="20" rx="4" fill="#fbbf24"/>
    <text x="230" y="25" font-family="Arial, sans-serif" font-size="12" fill="#fff">Primary Node</text>
    <rect x="380" y="10" width="20" height="20" rx="4" fill="#06b6d4"/>
    <text x="410" y="25" font-family="Arial, sans-serif" font-size="12" fill="#fff">Standby Node</text>
    <line x1="550" y1="20" x2="580" y2="20" stroke="#4f46e5" stroke-width="3"/>
    <text x="600" y="25" font-family="Arial, sans-serif" font-size="12" fill="#fff">Query Routing</text>
    <line x1="750" y1="20" x2="780" y2="20" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="800" y="25" font-family="Arial, sans-serif" font-size="12" fill="#fff">WAL Replication</text>
  </g>
</svg>
