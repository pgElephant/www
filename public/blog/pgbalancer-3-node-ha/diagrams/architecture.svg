<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="appGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="pgbalancerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="standbyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.8" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" opacity="0.8"/>
    </marker>
    <marker id="arrowheadBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3b82f6" opacity="0.8"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#0f172a" rx="8"/>
  
  <!-- Application Layer -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="900" height="80" rx="8" fill="url(#appGradient)" opacity="0.9"/>
    <rect x="0" y="0" width="900" height="80" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="450" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Application Layer</text>
    <text x="450" y="60" font-family="Arial, sans-serif" font-size="14" fill="#e0e7ff" text-anchor="middle">Connects to pgBalancer on port 9999</text>
  </g>
  
  <!-- Connection from App to pgBalancer -->
  <line x1="500" y1="110" x2="500" y2="160" stroke="#3b82f6" stroke-width="4" marker-end="url(#arrowheadBlue)"/>
  <text x="520" y="140" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6">Client Connections</text>
  
  <!-- pgBalancer Layer -->
  <g transform="translate(350, 160)">
    <rect x="0" y="0" width="300" height="120" rx="8" fill="url(#pgbalancerGradient)" opacity="0.95" filter="url(#glow)"/>
    <rect x="0" y="0" width="300" height="120" rx="8" fill="none" stroke="#4f46e5" stroke-width="3"/>
    <text x="150" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">pgBalancer Instance</text>
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="12" fill="#c7d2fe" text-anchor="middle">10.0.1.5:9999</text>
    <line x1="20" y1="65" x2="280" y2="65" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <text x="20" y="85" font-family="Arial, sans-serif" font-size="11" fill="#fff">• Connection Pooling</text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="11" fill="#fff">• AI-Powered Load Balancing</text>
    <text x="160" y="85" font-family="Arial, sans-serif" font-size="11" fill="#fff">• Automatic Failover</text>
    <text x="160" y="100" font-family="Arial, sans-serif" font-size="11" fill="#fff">• Health Monitoring</text>
  </g>
  
  <!-- Connections from pgBalancer to Nodes -->
  <line x1="400" y1="280" x2="200" y2="380" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="280" x2="500" y2="380" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="280" x2="800" y2="380" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="300" y="330" font-family="Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">Query Routing</text>
  <text x="500" y="330" font-family="Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">Load Balancing</text>
  <text x="700" y="330" font-family="Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">Health Checks</text>
  
  <!-- PostgreSQL Node 1 (Primary) -->
  <g transform="translate(100, 380)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="url(#primaryGradient)" opacity="0.95" filter="url(#glow)"/>
    <rect x="0" y="0" width="200" height="180" rx="8" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">PostgreSQL Node 1</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fef3c7" text-anchor="middle">PRIMARY</text>
    <line x1="20" y1="55" x2="180" y2="55" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">10.0.1.10:5432</text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="11" fill="#fff">✓ Accepts Writes</text>
    <text x="20" y="120" font-family="Arial, sans-serif" font-size="11" fill="#fff">✓ Serves Reads</text>
    <text x="20" y="140" font-family="Arial, sans-serif" font-size="11" fill="#fff">✓ Streams WAL</text>
    <text x="20" y="160" font-family="Arial, sans-serif" font-size="11" fill="#fff">✓ Hot Standby Ready</text>
  </g>
  
  <!-- PostgreSQL Node 2 (Standby) -->
  <g transform="translate(400, 380)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="url(#standbyGradient)" opacity="0.9" filter="url(#glow)"/>
    <rect x="0" y="0" width="200" height="180" rx="8" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">PostgreSQL Node 2</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#cffafe" text-anchor="middle">STANDBY</text>
    <line x1="20" y1="55" x2="180" y2="55" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">10.0.1.11:5432</text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="11" fill="#fff">✓ Receives WAL</text>
    <text x="20" y="120" font-family="Arial, sans-serif" font-size="11" fill="#fff">✓ Serves Reads</text>
    <text x="20" y="140" font-family="Arial, sans-serif" font-size="11" fill="#fff">✓ Hot Standby</text>
    <text x="20" y="160" font-family="Arial, sans-serif" font-size="11" fill="#fff">✓ Auto-Promote Ready</text>
  </g>
  
  <!-- PostgreSQL Node 3 (Standby) -->
  <g transform="translate(700, 380)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="url(#standbyGradient)" opacity="0.9" filter="url(#glow)"/>
    <rect x="0" y="0" width="200" height="180" rx="8" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">PostgreSQL Node 3</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#cffafe" text-anchor="middle">STANDBY</text>
    <line x1="20" y1="55" x2="180" y2="55" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">10.0.1.12:5432</text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="11" fill="#fff">✓ Receives WAL</text>
    <text x="20" y="120" font-family="Arial, sans-serif" font-size="11" fill="#fff">✓ Serves Reads</text>
    <text x="20" y="140" font-family="Arial, sans-serif" font-size="11" fill="#fff">✓ Hot Standby</text>
    <text x="20" y="160" font-family="Arial, sans-serif" font-size="11" fill="#fff">✓ Auto-Promote Ready</text>
  </g>
  
  <!-- Replication Lines -->
  <line x1="200" y1="470" x2="500" y2="470" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="490" x2="800" y2="490" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="350" y="475" font-family="Arial, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">WAL Streaming</text>
  <text x="500" y="505" font-family="Arial, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">WAL Streaming</text>
  
  <!-- Legend -->
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="900" height="30" rx="4" fill="#1e293b" opacity="0.8"/>
    <circle cx="20" cy="15" r="6" fill="#3b82f6"/>
    <text x="35" y="20" font-family="Arial, sans-serif" font-size="11" fill="#fff">Client Connection</text>
    <circle cx="180" cy="15" r="6" fill="#4f46e5"/>
    <text x="195" y="20" font-family="Arial, sans-serif" font-size="11" fill="#fff">Query Routing</text>
    <line x1="320" y1="15" x2="340" y2="15" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="350" y="20" font-family="Arial, sans-serif" font-size="11" fill="#fff">WAL Replication</text>
    <rect x="480" x="0" width="20" height="12" rx="2" fill="#fbbf24"/>
    <text x="510" y="20" font-family="Arial, sans-serif" font-size="11" fill="#fff">Primary Node</text>
    <rect x="600" x="0" width="20" height="12" rx="2" fill="#06b6d4"/>
    <text x="630" y="20" font-family="Arial, sans-serif" font-size="11" fill="#fff">Standby Node</text>
  </g>
</svg>
