<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="healthyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="failedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="promotingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.9" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ef4444" opacity="0.8"/>
    </marker>
    <marker id="arrowheadGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" opacity="0.8"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#0f172a" rx="8"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">Failover Scenario: Primary Node Failure</text>
  
  <!-- Before Failure State -->
  <g transform="translate(50, 70)">
    <text x="450" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#10b981" text-anchor="middle">Before Failure (Normal Operation)</text>
    
    <!-- pgBalancer -->
    <g transform="translate(400, 30)">
      <rect x="0" y="0" width="200" height="80" rx="8" fill="#4f46e5" opacity="0.9"/>
      <text x="100" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">pgBalancer</text>
      <text x="100" y="50" font-family="Arial, sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">All Nodes Healthy</text>
      <text x="100" y="65" font-family="Arial, sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">Routing: Primary (Writes)</text>
    </g>
    
    <!-- Node 1 Primary (Healthy) -->
    <g transform="translate(100, 130)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="url(#healthyGradient)" filter="url(#glow)"/>
      <rect x="0" y="0" width="180" height="100" rx="8" fill="none" stroke="#10b981" stroke-width="3"/>
      <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Node 1</text>
      <text x="90" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d1fae5" text-anchor="middle">PRIMARY ✓</text>
      <text x="90" y="65" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">10.0.1.10:5432</text>
      <text x="90" y="85" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Status: Healthy</text>
    </g>
    
    <!-- Node 2 Standby (Healthy) -->
    <g transform="translate(400, 130)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="url(#healthyGradient)" filter="url(#glow)"/>
      <rect x="0" y="0" width="180" height="100" rx="8" fill="none" stroke="#10b981" stroke-width="3"/>
      <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Node 2</text>
      <text x="90" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d1fae5" text-anchor="middle">STANDBY ✓</text>
      <text x="90" y="65" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">10.0.1.11:5432</text>
      <text x="90" y="85" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Status: Healthy</text>
    </g>
    
    <!-- Node 3 Standby (Healthy) -->
    <g transform="translate(700, 130)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="url(#healthyGradient)" filter="url(#glow)"/>
      <rect x="0" y="0" width="180" height="100" rx="8" fill="none" stroke="#10b981" stroke-width="3"/>
      <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Node 3</text>
      <text x="90" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d1fae5" text-anchor="middle">STANDBY ✓</text>
      <text x="90" y="65" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">10.0.1.12:5432</text>
      <text x="90" y="85" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Status: Healthy</text>
    </g>
  </g>
  
  <!-- Failure Detection -->
  <g transform="translate(50, 280)">
    <text x="450" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fbbf24" text-anchor="middle">Failure Detection (Health Check Fails)</text>
    
    <!-- pgBalancer -->
    <g transform="translate(400, 30)">
      <rect x="0" y="0" width="200" height="80" rx="8" fill="#fbbf24" opacity="0.9"/>
      <text x="100" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">pgBalancer</text>
      <text x="100" y="50" font-family="Arial, sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">⚠ Node 1 Unreachable</text>
      <text x="100" y="65" font-family="Arial, sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">Initiating Failover...</text>
    </g>
    
    <!-- Node 1 Primary (Failed) -->
    <g transform="translate(100, 130)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="url(#failedGradient)" filter="url(#glow)"/>
      <rect x="0" y="0" width="180" height="100" rx="8" fill="none" stroke="#ef4444" stroke-width="3"/>
      <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Node 1</text>
      <text x="90" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fee2e2" text-anchor="middle">FAILED ✗</text>
      <text x="90" y="65" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">10.0.1.10:5432</text>
      <text x="90" y="85" font-family="Arial, sans-serif" font-size="10" fill="#fee2e2" text-anchor="middle">Status: Down</text>
      <!-- X mark -->
      <line x1="20" y1="20" x2="160" y2="80" stroke="#fff" stroke-width="3" opacity="0.8"/>
      <line x1="160" y1="20" x2="20" y2="80" stroke="#fff" stroke-width="3" opacity="0.8"/>
    </g>
    
    <!-- Node 2 Standby (Healthy) -->
    <g transform="translate(400, 130)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="url(#healthyGradient)" filter="url(#glow)"/>
      <rect x="0" y="0" width="180" height="100" rx="8" fill="none" stroke="#10b981" stroke-width="3"/>
      <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Node 2</text>
      <text x="90" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d1fae5" text-anchor="middle">STANDBY ✓</text>
      <text x="90" y="65" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">10.0.1.11:5432</text>
      <text x="90" y="85" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Status: Healthy</text>
    </g>
    
    <!-- Node 3 Standby (Healthy) -->
    <g transform="translate(700, 130)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="url(#healthyGradient)" filter="url(#glow)"/>
      <rect x="0" y="0" width="180" height="100" rx="8" fill="none" stroke="#10b981" stroke-width="3"/>
      <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Node 3</text>
      <text x="90" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d1fae5" text-anchor="middle">STANDBY ✓</text>
      <text x="90" y="65" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">10.0.1.12:5432</text>
      <text x="90" y="85" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Status: Healthy</text>
    </g>
    
    <!-- Failure arrow -->
    <line x1="190" y1="180" x2="190" y2="230" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="200" y="210" font-family="Arial, sans-serif" font-size="11" fill="#ef4444">Health Check Failed</text>
  </g>
  
  <!-- After Failover -->
  <g transform="translate(50, 490)">
    <text x="450" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#10b981" text-anchor="middle">After Failover (New Primary Elected)</text>
    
    <!-- pgBalancer -->
    <g transform="translate(400, 30)">
      <rect x="0" y="0" width="200" height="80" rx="8" fill="#10b981" opacity="0.9"/>
      <text x="100" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">pgBalancer</text>
      <text x="100" y="50" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5" text-anchor="middle">✓ Failover Complete</text>
      <text x="100" y="65" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5" text-anchor="middle">New Primary: Node 2</text>
    </g>
    
    <!-- Node 1 Primary (Failed) -->
    <g transform="translate(100, 130)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="url(#failedGradient)" opacity="0.6"/>
      <rect x="0" y="0" width="180" height="100" rx="8" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
      <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle" opacity="0.7">Node 1</text>
      <text x="90" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fee2e2" text-anchor="middle" opacity="0.7">OFFLINE</text>
      <text x="90" y="65" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" opacity="0.7">10.0.1.10:5432</text>
    </g>
    
    <!-- Node 2 Standby -> Primary (Promoted) -->
    <g transform="translate(400, 130)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="url(#promotingGradient)" filter="url(#glow)"/>
      <rect x="0" y="0" width="180" height="100" rx="8" fill="none" stroke="#fbbf24" stroke-width="3"/>
      <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Node 2</text>
      <text x="90" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fef3c7" text-anchor="middle">PRIMARY ⚡</text>
      <text x="90" y="65" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">10.0.1.11:5432</text>
      <text x="90" y="85" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7" text-anchor="middle">Promoted & Active</text>
      <!-- Promotion arrow -->
      <path d="M 90,10 L 90,0 M 85,5 L 90,0 L 95,5" stroke="#fbbf24" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Node 3 Standby (Now replicating from Node 2) -->
    <g transform="translate(700, 130)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="url(#healthyGradient)" filter="url(#glow)"/>
      <rect x="0" y="0" width="180" height="100" rx="8" fill="none" stroke="#10b981" stroke-width="3"/>
      <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Node 3</text>
      <text x="90" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d1fae5" text-anchor="middle">STANDBY ✓</text>
      <text x="90" y="65" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">10.0.1.12:5432</text>
      <text x="90" y="85" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Replicating from Node 2</text>
    </g>
    
    <!-- Replication arrow from Node 2 to Node 3 -->
    <line x1="580" y1="180" x2="700" y2="180" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowheadGreen)"/>
    <text x="640" y="175" font-family="Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">WAL Stream</text>
  </g>
  
  <!-- Timeline -->
  <g transform="translate(50, 650)">
    <line x1="0" y1="0" x2="900" y2="0" stroke="#475569" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#10b981"/>
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">T0: Normal</text>
    <circle cx="300" cy="0" r="5" fill="#fbbf24"/>
    <text x="300" y="-10" font-family="Arial, sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">T1: Failure</text>
    <circle cx="600" cy="0" r="5" fill="#fbbf24"/>
    <text x="600" y="-10" font-family="Arial, sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">T2: Detection</text>
    <circle cx="900" cy="0" r="5" fill="#10b981"/>
    <text x="900" y="-10" font-family="Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">T3: Recovery</text>
  </g>
</svg>
