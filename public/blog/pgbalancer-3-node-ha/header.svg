<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Website theme gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070d1a;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>

  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  <rect width="1200" height="400" fill="url(#overlayGradient)"/>
  
  <!-- Subtle pattern overlay -->
  <g opacity="0.1">
    <circle cx="100" cy="100" r="3" fill="#fff"/>
    <circle cx="150" cy="150" r="2" fill="#fff"/>
    <circle cx="200" cy="80" r="2.5" fill="#fff"/>
    <circle cx="1000" cy="300" r="3" fill="#fff"/>
    <circle cx="1100" cy="200" r="2" fill="#fff"/>
    <circle cx="900" cy="250" r="2.5" fill="#fff"/>
  </g>
  
  <!-- HA cluster illustration -->
  <g transform="translate(80, 100)">
    <g opacity="0.9">
      <!-- Primary node -->
      <rect x="0" y="40" width="50" height="50" rx="8" fill="#fbbf24" opacity="0.9"/>
      <text x="25" y="70" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">P</text>
      <text x="25" y="105" font-family="Arial, sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Primary</text>
      
      <!-- Standby nodes -->
      <rect x="70" y="0" width="50" height="50" rx="8" fill="#06b6d4" opacity="0.9"/>
      <text x="95" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">S</text>
      <text x="95" y="65" font-family="Arial, sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle">Standby</text>
      
      <rect x="70" y="80" width="50" height="50" rx="8" fill="#06b6d4" opacity="0.9"/>
      <text x="95" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">S</text>
      <text x="95" y="145" font-family="Arial, sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle">Standby</text>
      
      <!-- Connection lines -->
      <line x1="50" y1="65" x2="70" y2="25" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
      <line x1="50" y1="65" x2="70" y2="105" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
      <line x1="25" y1="40" x2="25" y2="20" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
      <line x1="95" y1="50" x2="95" y2="80" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="350" y="150" font-family="Arial, sans-serif" font-size="50" font-weight="bold" 
        fill="url(#textGradient)">
    PostgreSQL HA
  </text>
  
  <!-- Subtitle -->
  <text x="350" y="200" font-family="Arial, sans-serif" font-size="20" 
        fill="#e0e7ff" opacity="0.9">
    with pgBalancer
  </text>
  
  <g transform="translate(350, 230)">
    <rect x="0" y="0" width="200" height="36" rx="18" fill="#4f46e5" opacity="0.2"/>
    <rect x="0" y="0" width="200" height="36" rx="18" fill="none" stroke="#4f46e5" stroke-width="2"/>
    <text x="100" y="24" font-family="Arial, sans-serif" font-size="11" font-weight="600" 
          fill="#fff" text-anchor="middle">✓ Automatic Failover</text>
  </g>
  <g transform="translate(600, 230)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#06b6d4" opacity="0.2"/>
    <rect x="0" y="0" width="180" height="36" rx="18" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="90" y="24" font-family="Arial, sans-serif" font-size="11" font-weight="600" 
          fill="#fff" text-anchor="middle">✓ Zero Downtime</text>
  </g>
  <g transform="translate(350, 280)">
    <rect x="0" y="0" width="200" height="36" rx="18" fill="#10b981" opacity="0.2"/>
    <rect x="0" y="0" width="200" height="36" rx="18" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="24" font-family="Arial, sans-serif" font-size="11" font-weight="600" 
          fill="#fff" text-anchor="middle">✓ Load Balancing</text>
  </g>
  <g transform="translate(600, 280)">
    <rect x="0" y="0" width="200" height="36" rx="18" fill="#fbbf24" opacity="0.2"/>
    <rect x="0" y="0" width="200" height="36" rx="18" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="100" y="24" font-family="Arial, sans-serif" font-size="11" font-weight="600" 
          fill="#fff" text-anchor="middle">✓ Production Ready</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="950" cy="150" r="40" fill="#4f46e5" opacity="0.15"/>
  <circle cx="1050" cy="220" r="30" fill="#06b6d4" opacity="0.15"/>
  <circle cx="980" cy="280" r="25" fill="#10b981" opacity="0.15"/>
  <circle cx="1100" cy="150" r="20" fill="#fbbf24" opacity="0.15"/>
</svg>
