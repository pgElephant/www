<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Website theme gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070d1a;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  <rect width="1200" height="400" fill="url(#overlayGradient)"/>
  
  <!-- Subtle pattern overlay -->
  <g opacity="0.1">
    <circle cx="100" cy="100" r="3" fill="#fff"/>
    <circle cx="150" cy="150" r="2" fill="#fff"/>
    <circle cx="200" cy="80" r="2.5" fill="#fff"/>
    <circle cx="1000" cy="300" r="3" fill="#fff"/>
    <circle cx="1100" cy="200" r="2" fill="#fff"/>
    <circle cx="900" cy="250" r="2.5" fill="#fff"/>
  </g>
  
  <!-- Left side: pgBalancer Load Balancer illustration -->
  <g transform="translate(50, 100)">
    <g opacity="0.9">
      <!-- Central hub representing pgBalancer -->
      <circle cx="100" cy="80" r="45" fill="none" stroke="#4f46e5" stroke-width="3"/>
      <circle cx="100" cy="80" r="35" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6"/>
      <!-- Incoming connections -->
      <line x1="20" y1="40" x2="70" y2="60" stroke="#06b6d4" stroke-width="3"/>
      <line x1="20" y1="80" x2="70" y2="75" stroke="#06b6d4" stroke-width="3"/>
      <line x1="20" y1="120" x2="70" y2="95" stroke="#06b6d4" stroke-width="3"/>
      <circle cx="20" cy="40" r="5" fill="#06b6d4"/>
      <circle cx="20" cy="80" r="5" fill="#06b6d4"/>
      <circle cx="20" cy="120" r="5" fill="#06b6d4"/>
      <!-- Outgoing to backends -->
      <line x1="130" y1="60" x2="200" y2="40" stroke="#10b981" stroke-width="3"/>
      <line x1="130" y1="80" x2="200" y2="80" stroke="#10b981" stroke-width="3"/>
      <line x1="130" y1="100" x2="200" y2="120" stroke="#10b981" stroke-width="3"/>
      <circle cx="200" cy="40" r="6" fill="#10b981"/>
      <circle cx="200" cy="80" r="6" fill="#10b981"/>
      <circle cx="200" cy="120" r="6" fill="#10b981"/>
      <!-- AI/Brain symbol in center -->
      <path d="M 85,70 Q 100,65 115,70 Q 100,75 85,70" fill="#fbbf24" opacity="0.7"/>
      <path d="M 85,90 Q 100,85 115,90 Q 100,95 85,90" fill="#fbbf24" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Right side: pg_stat_insights Analytics illustration -->
  <g transform="translate(800, 100)">
    <g opacity="0.9">
      <!-- Chart bars representing performance metrics -->
      <rect x="20" y="80" width="18" height="50" fill="#4f46e5" rx="2" opacity="0.9"/>
      <rect x="48" y="45" width="18" height="85" fill="#06b6d4" rx="2" opacity="0.9"/>
      <rect x="76" y="60" width="18" height="70" fill="#10b981" rx="2" opacity="0.9"/>
      <rect x="104" y="70" width="18" height="60" fill="#fbbf24" rx="2" opacity="0.9"/>
      <!-- Chart axis -->
      <line x1="15" y1="20" x2="15" y2="130" stroke="#6b7280" stroke-width="2"/>
      <line x1="15" y1="130" x2="130" y2="130" stroke="#6b7280" stroke-width="2"/>
      <!-- Metrics circles -->
      <circle cx="50" cy="20" r="8" fill="#4f46e5" opacity="0.6"/>
      <circle cx="90" cy="15" r="6" fill="#06b6d4" opacity="0.6"/>
      <circle cx="120" cy="25" r="7" fill="#10b981" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Connection line between pgBalancer and pg_stat_insights -->
  <g opacity="0.6">
    <path d="M 300 180 Q 500 150, 750 180" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="5,5"/>
    <circle cx="525" cy="165" r="4" fill="#06b6d4"/>
    <text x="520" y="155" font-family="Arial, sans-serif" font-size="12" fill="#06b6d4" text-anchor="middle">Performance Data</text>
  </g>
  
  <!-- Title -->
  <text x="350" y="120" font-family="Arial, sans-serif" font-size="42" font-weight="bold" 
        fill="url(#textGradient)">
    pgBalancer + pg_stat_insights
  </text>
  
  <!-- Subtitle -->
  <text x="350" y="160" font-family="Arial, sans-serif" font-size="18" 
        fill="#e0e7ff" opacity="0.9">
    Complete PostgreSQL Performance Stack
  </text>
  
  <!-- Feature badges -->
  <g transform="translate(350, 200)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#4f46e5" opacity="0.2"/>
    <rect x="0" y="0" width="160" height="32" rx="16" fill="none" stroke="#4f46e5" stroke-width="2"/>
    <text x="80" y="21" font-family="Arial, sans-serif" font-size="10" font-weight="600" 
          fill="#fff" text-anchor="middle">AI Load Balancing</text>
  </g>
  <g transform="translate(530, 200)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#06b6d4" opacity="0.2"/>
    <rect x="0" y="0" width="180" height="32" rx="16" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="90" y="21" font-family="Arial, sans-serif" font-size="10" font-weight="600" 
          fill="#fff" text-anchor="middle">52 Performance Metrics</text>
  </g>
  <g transform="translate(350, 245)">
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#10b981" opacity="0.2"/>
    <rect x="0" y="0" width="150" height="32" rx="16" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="75" y="21" font-family="Arial, sans-serif" font-size="10" font-weight="600" 
          fill="#fff" text-anchor="middle">42 Analytics Views</text>
  </g>
  <g transform="translate(520, 245)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#fbbf24" opacity="0.2"/>
    <rect x="0" y="0" width="160" height="32" rx="16" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="80" y="21" font-family="Arial, sans-serif" font-size="10" font-weight="600" 
          fill="#fff" text-anchor="middle">✓ Production Ready</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="1050" cy="100" r="35" fill="#4f46e5" opacity="0.1"/>
  <circle cx="1100" cy="180" r="25" fill="#06b6d4" opacity="0.1"/>
  <circle cx="1020" cy="250" r="30" fill="#10b981" opacity="0.1"/>
</svg>
