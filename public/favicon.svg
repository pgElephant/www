<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with vibrant gradient -->
  <defs>
    <linearGradient id="elephantGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dark background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)" stroke="url(#elephantGradient)" stroke-width="2"/>
  
  <!-- Stylized elephant - simplified and bold for favicon visibility -->
  <g transform="translate(50, 50) scale(0.6)">
    <!-- Elephant body -->
    <ellipse cx="0" cy="5" rx="28" ry="22" fill="url(#elephantGradient)" opacity="0.9"/>
    
    <!-- Elephant head -->
    <circle cx="-15" cy="-5" r="18" fill="url(#elephantGradient)" opacity="0.95"/>
    
    <!-- Elephant trunk - thicker for visibility -->
    <path d="M -25,-5 Q -35,5 -30,15 Q -28,20 -25,18" 
          fill="none" 
          stroke="url(#elephantGradient)" 
          stroke-width="4" 
          stroke-linecap="round"
          opacity="1"/>
    
    <!-- Elephant ear -->
    <ellipse cx="-25" cy="-8" rx="10" ry="15" fill="url(#elephantGradient)" opacity="0.7"/>
    
    <!-- Eye - bright white for contrast -->
    <circle cx="-10" cy="-8" r="3" fill="#ffffff" opacity="1"/>
    <circle cx="-10" cy="-8" r="1.5" fill="#0f172a" opacity="1"/>
    
    <!-- Legs - thicker for visibility -->
    <rect x="-8" y="20" width="5" height="12" rx="2" fill="url(#elephantGradient)" opacity="0.9"/>
    <rect x="3" y="20" width="5" height="12" rx="2" fill="url(#elephantGradient)" opacity="0.9"/>
    
    <!-- PostgreSQL "Pg" text badge - bold and visible -->
    <text x="15" y="8" 
          font-family="Arial, sans-serif" 
          font-size="18" 
          font-weight="bold" 
          fill="#ffffff" 
          opacity="1">Pg</text>
  </g>
</svg>
