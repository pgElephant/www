<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra-modern gradient background -->
    <linearGradient id="modernGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
    
    <!-- Neon glow gradients -->
    <radialGradient id="neonPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="neonCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#0891b2;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="neonGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0" />
    </radialGradient>
    
    <!-- Geometric shape gradients -->
    <linearGradient id="shapeGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.1" />
    </linearGradient>
    
    <linearGradient id="shapeGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Filters for advanced effects -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    
    <filter id="ultraBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  
  <!-- Base ultra-modern background -->
  <rect width="1920" height="1080" fill="url(#modernGradient)"/>
  
  <!-- Large ambient light sources -->
  <circle cx="300" cy="200" r="400" fill="url(#neonPurple)" filter="url(#ultraBlur)" opacity="0.4">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 30,20; -20,30; 0,0" 
      dur="20s" 
      repeatCount="indefinite"/>
  </circle>
  
  <circle cx="1600" cy="300" r="350" fill="url(#neonCyan)" filter="url(#ultraBlur)" opacity="0.3">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; -25,35; 40,-15; 0,0" 
      dur="25s" 
      repeatCount="indefinite"/>
  </circle>
  
  <circle cx="960" cy="800" r="500" fill="url(#neonGreen)" filter="url(#ultraBlur)" opacity="0.2">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 50,-25; -30,40; 0,0" 
      dur="30s" 
      repeatCount="indefinite"/>
  </circle>
  
  <!-- Futuristic geometric shapes -->
  
  <!-- Floating triangular prisms -->
  <g opacity="0.15">
    <polygon points="100,400 200,350 150,300 50,350" fill="url(#shapeGradient1)" filter="url(#neonGlow)">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 125 362.5; 360 125 362.5" 
        dur="45s" 
        repeatCount="indefinite"/>
    </polygon>
    
    <polygon points="1700,500 1800,450 1750,400 1650,450" fill="url(#shapeGradient2)" filter="url(#neonGlow)">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 1725 462.5; -360 1725 462.5" 
        dur="40s" 
        repeatCount="indefinite"/>
    </polygon>
    
    <polygon points="800,150 920,100 860,50 740,100" fill="url(#shapeGradient1)" filter="url(#neonGlow)">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0 830 112.5; 360 830 112.5" 
        dur="35s" 
        repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- Hexagonal wireframe structures -->
  <g opacity="0.1" stroke="#8b5cf6" stroke-width="2" fill="none" filter="url(#neonGlow)">
    <polygon points="400,300 450,275 450,225 400,200 350,225 350,275">
      <animateTransform 
        attributeName="transform" 
        type="scale" 
        values="1 1; 1.2 1.2; 1 1" 
        dur="8s" 
        repeatCount="indefinite"/>
    </polygon>
    
    <polygon points="1200,400 1250,375 1250,325 1200,300 1150,325 1150,375">
      <animateTransform 
        attributeName="transform" 
        type="scale" 
        values="1 1; 1.3 1.3; 1 1" 
        dur="10s" 
        repeatCount="indefinite"/>
    </polygon>
    
    <polygon points="600,700 650,675 650,625 600,600 550,625 550,675">
      <animateTransform 
        attributeName="transform" 
        type="scale" 
        values="1 1; 1.1 1.1; 1 1" 
        dur="12s" 
        repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- Data stream lines with gradient animation -->
  <g opacity="0.2" stroke="url(#shapeGradient1)" stroke-width="3" fill="none">
    <path d="M 0 540 Q 480 400 960 540 Q 1440 680 1920 540">
      <animate attributeName="stroke-dasharray" values="0,2000;100,1900;0,2000" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="15s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 440 Q 320 300 640 440 Q 960 580 1280 440 Q 1600 300 1920 440">
      <animate attributeName="stroke-dasharray" values="0,2500;150,2350;0,2500" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Floating tech elements -->
  <g opacity="0.08" fill="#ffffff">
    <!-- Circuit-like patterns -->
    <g transform="translate(200, 200)">
      <rect x="0" y="0" width="40" height="4" rx="2"/>
      <rect x="15" y="-8" width="4" height="20" rx="2"/>
      <rect x="25" y="-8" width="4" height="20" rx="2"/>
      <circle cx="10" cy="2" r="3"/>
      <circle cx="35" cy="2" r="3"/>
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="200,200; 220,180; 200,200" 
        dur="25s" 
        repeatCount="indefinite"/>
    </g>
    
    <g transform="translate(1500, 600)">
      <rect x="0" y="0" width="30" height="3" rx="1.5"/>
      <rect x="10" y="-6" width="3" height="15" rx="1.5"/>
      <rect x="20" y="-6" width="3" height="15" rx="1.5"/>
      <circle cx="7" cy="1.5" r="2"/>
      <circle cx="25" cy="1.5" r="2"/>
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="1500,600; 1480,620; 1500,600" 
        dur="30s" 
        repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Cyber grid overlay -->
  <g opacity="0.03" stroke="#06b6d4" stroke-width="0.5" fill="none">
    <defs>
      <pattern id="cyberGrid" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M 100 0 L 0 0 0 100" />
      </pattern>
    </defs>
    <rect width="1920" height="1080" fill="url(#cyberGrid)"/>
  </g>
  
  <!-- Pulsing nodes -->
  <g opacity="0.4">
    <circle cx="300" cy="300" r="4" fill="#8b5cf6" filter="url(#neonGlow)">
      <animate attributeName="r" values="2;8;2" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="800" cy="400" r="3" fill="#06b6d4" filter="url(#neonGlow)">
      <animate attributeName="r" values="1;6;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="1400" cy="300" r="5" fill="#10b981" filter="url(#neonGlow)">
      <animate attributeName="r" values="3;10;3" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="600" cy="700" r="3" fill="#f59e0b" filter="url(#neonGlow)">
      <animate attributeName="r" values="1;7;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Holographic overlay effect -->
  <rect width="1920" height="1080" fill="none" stroke="url(#shapeGradient1)" stroke-width="1" opacity="0.05">
    <animate attributeName="opacity" values="0.02;0.08;0.02" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>