<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Technical gradient background -->
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#0f1419;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f2e;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b263b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Code and terminal colors -->
    <linearGradient id="codeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00cc33;stop-opacity:0.3" />
    </linearGradient>
    
    <linearGradient id="codeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:0.3" />
    </linearGradient>
    
    <linearGradient id="codeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#cc5529;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- Glowing effects for technical elements -->
    <filter id="techGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    
    <!-- Pattern for circuit board traces -->
    <pattern id="circuitBoard" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="none"/>
      <path d="M0,60 L60,60 L60,0 M60,60 L120,60 M60,60 L60,120" stroke="#00ff41" stroke-width="0.8" opacity="0.15"/>
      <circle cx="20" cy="20" r="2" fill="#00ff41" opacity="0.3"/>
      <circle cx="100" cy="100" r="2" fill="#00d4ff" opacity="0.3"/>
      <circle cx="60" cy="60" r="1.5" fill="#ff6b35" opacity="0.4"/>
    </pattern>
    
    <!-- Database table pattern -->
    <pattern id="dbPattern" x="0" y="0" width="200" height="150" patternUnits="userSpaceOnUse">
      <rect width="200" height="150" fill="none"/>
      <rect x="10" y="10" width="80" height="60" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2"/>
      <line x1="15" y1="25" x2="85" y2="25" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
      <line x1="15" y1="35" x2="85" y2="35" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
      <line x1="15" y1="45" x2="85" y2="45" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
      <line x1="15" y1="55" x2="85" y2="55" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
      
      <rect x="110" y="30" width="80" height="60" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.2"/>
      <line x1="115" y1="45" x2="185" y2="45" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
      <line x1="115" y1="55" x2="185" y2="55" stroke="#00ff41" stroke-width="0.5" opacity="0.2"/>
      <line x1="115" y1="65" x2="185" y2="65" stroke="#00ff41" stroke-width="0.5" opacity="0.2"/>
      <line x1="115" y1="75" x2="185" y2="75" stroke="#00ff41" stroke-width="0.5" opacity="0.2"/>
      
      <!-- Connection lines -->
      <line x1="90" y1="40" x2="110" y2="60" stroke="#ff6b35" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Base technical background -->
  <rect width="1920" height="1080" fill="url(#techGradient)"/>
  
  <!-- Circuit board overlay -->
  <rect width="1920" height="1080" fill="url(#circuitBoard)" opacity="0.4"/>
  
  <!-- Database schema overlay -->
  <rect width="1920" height="1080" fill="url(#dbPattern)" opacity="0.3"/>
  
  <!-- Code blocks and terminal windows -->
  <g opacity="0.15">
    <!-- Terminal window 1 -->
    <rect x="50" y="100" width="300" height="180" rx="8" fill="#0a0a0f" stroke="#00ff41" stroke-width="1"/>
    <rect x="50" y="100" width="300" height="25" rx="8" fill="#00ff41" opacity="0.3"/>
    <circle cx="70" cy="112" r="4" fill="#ff6b35"/>
    <circle cx="85" cy="112" r="4" fill="#ffdd35"/>
    <circle cx="100" cy="112" r="4" fill="#00ff41"/>
    <text x="65" y="150" font-family="monospace" font-size="8" fill="#00ff41" opacity="0.8">
      <tspan x="65" dy="0">$ SELECT * FROM users</tspan>
      <tspan x="65" dy="12">WHERE status = 'active'</tspan>
      <tspan x="65" dy="12">ORDER BY created_at;</tspan>
      <tspan x="65" dy="24">╭─────┬────────┬─────────╮</tspan>
      <tspan x="65" dy="12">│ id  │ name   │ status  │</tspan>
      <tspan x="65" dy="12">├─────┼────────┼─────────┤</tspan>
      <tspan x="65" dy="12">│ 1   │ alice  │ active  │</tspan>
      <tspan x="65" dy="12">╰─────┴────────┴─────────╯</tspan>
    </text>
    
    <!-- Animation for terminal -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 10,-5; 0,0" 
      dur="30s" 
      repeatCount="indefinite"/>
  </g>
  
  <g opacity="0.12">
    <!-- Code editor window -->
    <rect x="1400" y="200" width="400" height="250" rx="8" fill="#0f1419" stroke="#00d4ff" stroke-width="1"/>
    <rect x="1400" y="200" width="400" height="30" rx="8" fill="#00d4ff" opacity="0.2"/>
    <text x="1420" y="250" font-family="monospace" font-size="7" fill="#00d4ff" opacity="0.9">
      <tspan x="1420" dy="0">function balanceLoad(nodes) {</tspan>
      <tspan x="1420" dy="14">  const weights = nodes.map(node => {</tspan>
      <tspan x="1420" dy="14">    return calculateWeight(</tspan>
      <tspan x="1420" dy="14">      node.cpu_usage,</tspan>
      <tspan x="1420" dy="14">      node.memory_usage,</tspan>
      <tspan x="1420" dy="14">      node.connection_count</tspan>
      <tspan x="1420" dy="14">    );</tspan>
      <tspan x="1420" dy="14">  });</tspan>
      <tspan x="1420" dy="14">  return selectOptimalNode(weights);</tspan>
      <tspan x="1420" dy="14">}</tspan>
    </text>
    
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; -8,5; 0,0" 
      dur="25s" 
      repeatCount="indefinite"/>
  </g>
  
  <g opacity="0.10">
    <!-- JSON data structure -->
    <rect x="200" y="600" width="350" height="200" rx="8" fill="#1a1f2e" stroke="#ff6b35" stroke-width="1"/>
    <text x="220" y="640" font-family="monospace" font-size="7" fill="#ff6b35" opacity="0.8">
      <tspan x="220" dy="0">{</tspan>
      <tspan x="220" dy="14">  "cluster": {</tspan>
      <tspan x="220" dy="14">    "nodes": [</tspan>
      <tspan x="220" dy="14">      {</tspan>
      <tspan x="220" dy="14">        "id": "pg-node-1",</tspan>
      <tspan x="220" dy="14">        "role": "primary",</tspan>
      <tspan x="220" dy="14">        "status": "healthy",</tspan>
      <tspan x="220" dy="14">        "connections": 45</tspan>
      <tspan x="220" dy="14">      },</tspan>
      <tspan x="220" dy="14">      {</tspan>
      <tspan x="220" dy="14">        "id": "pg-node-2",</tspan>
      <tspan x="220" dy="14">        "role": "replica"</tspan>
      <tspan x="220" dy="14">      }</tspan>
    </text>
    
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 5,8; 0,0" 
      dur="35s" 
      repeatCount="indefinite"/>
  </g>
  
  <!-- Network topology diagrams -->
  <g opacity="0.2" stroke="#00ff41" stroke-width="2" fill="none">
    <!-- Database cluster diagram -->
    <g transform="translate(800, 150)">
      <!-- Primary node -->
      <circle cx="0" cy="0" r="20" fill="#00ff41" opacity="0.3"/>
      <text x="-8" y="4" font-family="monospace" font-size="10" fill="#00ff41">P</text>
      
      <!-- Replica nodes -->
      <circle cx="60" cy="40" r="15" fill="#00d4ff" opacity="0.3"/>
      <text x="-3" y="4" font-family="monospace" font-size="8" fill="#00d4ff" transform="translate(60, 40)">R1</text>
      
      <circle cx="60" cy="-40" r="15" fill="#00d4ff" opacity="0.3"/>
      <text x="-3" y="4" font-family="monospace" font-size="8" fill="#00d4ff" transform="translate(60, -40)">R2</text>
      
      <circle cx="-60" cy="0" r="15" fill="#00d4ff" opacity="0.3"/>
      <text x="-3" y="4" font-family="monospace" font-size="8" fill="#00d4ff" transform="translate(-60, 0)">R3</text>
      
      <!-- Connection lines with data flow animation -->
      <line x1="20" y1="0" x2="45" y2="35" stroke="#00ff41" stroke-width="1.5">
        <animate attributeName="stroke-dasharray" values="0,100;10,90;0,100" dur="3s" repeatCount="indefinite"/>
      </line>
      <line x1="20" y1="0" x2="45" y2="-35" stroke="#00ff41" stroke-width="1.5">
        <animate attributeName="stroke-dasharray" values="0,100;10,90;0,100" dur="3.5s" repeatCount="indefinite"/>
      </line>
      <line x1="-20" y1="0" x2="-45" y2="0" stroke="#00ff41" stroke-width="1.5">
        <animate attributeName="stroke-dasharray" values="0,100;10,90;0,100" dur="4s" repeatCount="indefinite"/>
      </line>
      
      <!-- Load balancer -->
      <rect x="-10" y="-80" width="20" height="15" rx="3" fill="#ff6b35" opacity="0.4"/>
      <text x="-6" y="-70" font-family="monospace" font-size="6" fill="#ff6b35">LB</text>
      <line x1="0" y1="-65" x2="0" y2="-25" stroke="#ff6b35" stroke-width="1.5">
        <animate attributeName="stroke-dasharray" values="0,40;5,35;0,40" dur="2s" repeatCount="indefinite"/>
      </line>
    </g>
    
    <!-- Connection pool diagram -->
    <g transform="translate(1200, 600)">
      <!-- Connection pool -->
      <rect x="-30" y="-20" width="60" height="40" rx="5" fill="#00d4ff" opacity="0.3"/>
      <text x="-15" y="4" font-family="monospace" font-size="8" fill="#00d4ff">POOL</text>
      
      <!-- Client connections -->
      <circle cx="-80" cy="-30" r="8" fill="#00ff41" opacity="0.4"/>
      <circle cx="-80" cy="0" r="8" fill="#00ff41" opacity="0.4"/>
      <circle cx="-80" cy="30" r="8" fill="#00ff41" opacity="0.4"/>
      
      <!-- Database connections -->
      <circle cx="80" cy="-20" r="10" fill="#ff6b35" opacity="0.4"/>
      <circle cx="80" cy="20" r="10" fill="#ff6b35" opacity="0.4"/>
      
      <!-- Connection lines -->
      <line x1="-72" y1="-30" x2="-35" y2="-15" stroke="#00ff41" stroke-width="1">
        <animate attributeName="stroke-dasharray" values="0,50;8,42;0,50" dur="2.5s" repeatCount="indefinite"/>
      </line>
      <line x1="-72" y1="0" x2="-35" y2="0" stroke="#00ff41" stroke-width="1">
        <animate attributeName="stroke-dasharray" values="0,50;8,42;0,50" dur="3s" repeatCount="indefinite"/>
      </line>
      <line x1="-72" y1="30" x2="-35" y2="15" stroke="#00ff41" stroke-width="1">
        <animate attributeName="stroke-dasharray" values="0,50;8,42;0,50" dur="2s" repeatCount="indefinite"/>
      </line>
      
      <line x1="30" y1="-10" x2="70" y2="-15" stroke="#ff6b35" stroke-width="1.5">
        <animate attributeName="stroke-dasharray" values="0,50;8,42;0,50" dur="1.5s" repeatCount="indefinite"/>
      </line>
      <line x1="30" y1="10" x2="70" y2="15" stroke="#ff6b35" stroke-width="1.5">
        <animate attributeName="stroke-dasharray" values="0,50;8,42;0,50" dur="2s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
  
  <!-- Floating technical elements -->
  <g opacity="0.08">
    <!-- System metrics -->
    <g transform="translate(100, 400)">
      <text font-family="monospace" font-size="8" fill="#00ff41">
        <tspan x="0" y="0">CPU: 45.2%</tspan>
        <tspan x="0" y="15">MEM: 2.1/8.0 GB</tspan>
        <tspan x="0" y="30">CONN: 127/200</tspan>
        <tspan x="0" y="45">TPS: 1,432</tspan>
      </text>
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="100,400; 120,380; 100,400" 
        dur="20s" 
        repeatCount="indefinite"/>
    </g>
    
    <!-- Query execution plan -->
    <g transform="translate(1500, 450)">
      <text font-family="monospace" font-size="7" fill="#00d4ff">
        <tspan x="0" y="0">┌─ Nested Loop</tspan>
        <tspan x="0" y="12">├─ Index Scan: users_idx</tspan>
        <tspan x="0" y="24">│  Cost: 0.29..8.31</tspan>
        <tspan x="0" y="36">└─ Seq Scan: orders</tspan>
        <tspan x="0" y="48">   Cost: 0.00..12.75</tspan>
      </text>
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="1500,450; 1480,470; 1500,450" 
        dur="25s" 
        repeatCount="indefinite"/>
    </g>
    
    <!-- Binary data stream -->
    <g transform="translate(600, 50)">
      <text font-family="monospace" font-size="6" fill="#ff6b35">
        <tspan x="0" y="0">1101001 0110110 1001101</tspan>
        <tspan x="0" y="12">0101010 1110001 0011010</tspan>
        <tspan x="0" y="24">1010101 0001111 1100110</tspan>
      </text>
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="600,50; 580,70; 600,50" 
        dur="18s" 
        repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Data flow arrows -->
  <g opacity="0.3" stroke="#00ff41" stroke-width="2" fill="#00ff41" marker-end="url(#arrowhead)">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#00ff41" opacity="0.6"/>
      </marker>
    </defs>
    
    <!-- Curved data flow paths -->
    <path d="M 100 300 Q 500 200 900 400" fill="none">
      <animate attributeName="stroke-dasharray" values="0,800;50,750;0,800" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M 1800 200 Q 1400 400 1000 300" fill="none">
      <animate attributeName="stroke-dasharray" values="0,800;50,750;0,800" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M 200 800 Q 800 600 1400 900" fill="none">
      <animate attributeName="stroke-dasharray" values="0,1200;80,1120;0,1200" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Pulsing technical indicators -->
  <g opacity="0.5">
    <circle cx="150" cy="200" r="3" fill="#00ff41" filter="url(#techGlow)">
      <animate attributeName="r" values="1;6;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1700" cy="300" r="2" fill="#00d4ff" filter="url(#techGlow)">
      <animate attributeName="r" values="1;5;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="500" r="4" fill="#ff6b35" filter="url(#techGlow)">
      <animate attributeName="r" values="2;8;2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="800" r="2" fill="#00ff41" filter="url(#techGlow)">
      <animate attributeName="r" values="1;4;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Subtle grid overlay -->
  <defs>
    <pattern id="techGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4ff" stroke-width="0.3" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#techGrid)"/>
  
  <!-- Holographic border effect -->
  <rect width="1920" height="1080" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.08">
    <animate attributeName="opacity" values="0.04;0.12;0.04" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>